# Reusable workflow: asks a muelle host to deploy (or tear down) a site.
# It builds nothing: the caller builds the site and uploads it with
# actions/upload-artifact@v4, then passes artifact-id and artifact-digest here.
name: muelle deploy

on:
  workflow_call:
    inputs:
      endpoint:
        description: Base URL of the muelle receiver, e.g. https://muelle.example.com
        type: string
        required: true
      site:
        description: Site name as declared in services.muelle.sites
        type: string
        required: true
      action:
        description: deploy | teardown
        type: string
        default: deploy
      environment:
        description: prod | next | preview
        type: string
        default: preview
      artifact-id:
        description: artifact-id output of actions/upload-artifact (deploy only)
        type: string
        default: ""
      artifact-digest:
        description: artifact-digest output of actions/upload-artifact (deploy only)
        type: string
        default: ""
      branch:
        description: Branch name; defaults to the triggering branch
        type: string
        default: ""
      timeout-seconds:
        description: How long to wait for the host to finish
        type: number
        default: 600
    secrets:
      muelle-secret:
        description: HMAC secret shared with the host for this site
        required: true
    outputs:
      url:
        description: URL of the deployed environment
        value: ${{ jobs.muelle.outputs.url }}

permissions:
  actions: read
  contents: read
  deployments: write

jobs:
  muelle:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.run.outputs.url }}
    steps:
      - id: run
        shell: bash
        env:
          ENDPOINT: ${{ inputs.endpoint }}
          SITE: ${{ inputs.site }}
          ACTION: ${{ inputs.action }}
          ENV: ${{ inputs.environment }}
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
          BRANCH: ${{ inputs.branch || github.event.ref || github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TIMEOUT: ${{ inputs.timeout-seconds }}
          SECRET: ${{ secrets.muelle-secret }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH=${BRANCH#refs/heads/}
          id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SITE}-$(date +%s)"
          id=${id//[^A-Za-z0-9-]/-}

          deployment=""
          set_state() {
            [[ -n $deployment ]] || return 0
            gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment/statuses" \
              -f state="$1" -f environment_url="${2:-}" \
              -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null || true
          }

          if [[ $ACTION == deploy ]]; then
            [[ -n $ARTIFACT_ID && -n $ARTIFACT_DIGEST ]] || { echo "::error::artifact-id and artifact-digest are required"; exit 1; }
            digest=${ARTIFACT_DIGEST#sha256:}
            case $ENV in
              prod) gh_env=production; transient=false; production=true ;;
              next) gh_env=next; transient=false; production=false ;;
              *) gh_env="preview/$BRANCH"; transient=true; production=false ;;
            esac
            deployment=$(jq -n --arg ref "$SHA" --arg env "$gh_env" \
                --argjson transient "$transient" --argjson production "$production" \
                '{ref: $ref, environment: $env, auto_merge: false, required_contexts: [],
                  transient_environment: $transient, production_environment: $production}' |
              gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id) || deployment=""
            set_state in_progress
            body=$(jq -cn --arg id "$id" --arg site "$SITE" --arg env "$ENV" --arg branch "$BRANCH" \
              --arg sha "$SHA" --arg sha256 "$digest" --arg token "$GH_TOKEN" \
              --arg url "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
              --argjson ts "$(date +%s)" \
              '{id: $id, site: $site, action: "deploy", env: $env, branch: $branch, sha: $sha,
                sha256: $sha256, artifact_url: $url, token: $token, ts: $ts}')
          else
            body=$(jq -cn --arg id "$id" --arg site "$SITE" --arg branch "$BRANCH" --argjson ts "$(date +%s)" \
              '{id: $id, site: $site, action: "teardown", env: "preview", branch: $branch, ts: $ts}')
          fi

          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" -r | cut -d' ' -f1)
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -H "X-Muelle-Signature: sha256=$sig" \
            --data-binary "$body" "$ENDPOINT/hooks/$SITE")
          if [[ $code != 200 ]]; then
            echo "::error::muelle rejected the request ($code): $(head -c 500 resp.json)"
            set_state failure
            exit 1
          fi

          deadline=$(( $(date +%s) + TIMEOUT ))
          while :; do
            sleep 3
            status=$(curl -sS "$ENDPOINT/status/$id" || echo '{}')
            state=$(jq -r '.state // "unknown"' <<<"$status")
            case $state in
              success|failure) break ;;
            esac
            if (( $(date +%s) > deadline )); then state=timeout; break; fi
          done

          url=$(jq -r '.url // ""' <<<"$status")
          message=$(jq -r '.message // ""' <<<"$status")
          echo "url=$url" >>"$GITHUB_OUTPUT"
          echo "muelle: $state $message"
          if [[ $state == success ]]; then
            set_state success "$url"
            if [[ -n $url ]]; then echo "Deployed **$SITE** ($ENV): $url" >>"$GITHUB_STEP_SUMMARY"; fi
          else
            set_state failure
            echo "::error::muelle $state: $message"
            exit 1
          fi
