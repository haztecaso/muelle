name: ci

on:
  push:
    branches: [main]
  pull_request:
  # flake-update.yml dispatches this: PRs opened with GITHUB_TOKEN trigger nothing else
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Two jobs, named after the required checks on main. Each check is a step
# that runs even when an earlier one failed (!cancelled()), so one run
# reports every failure.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - id: sync
        run: uv sync --locked
      - name: actionlint
        if: ${{ !cancelled() }}
        run: nix run nixpkgs#actionlint
      - name: actions pinned by commit sha
        if: ${{ !cancelled() }}
        # tags can be moved; local actions (./) are exempt
        run: |
          if git grep -nE '^\s*(-\s+)?uses:\s+[^.[:space:]]' -- action.yml .github/workflows \
              | grep -vE 'uses:\s+[^@[:space:]]+@[0-9a-f]{40}(\s|$)'; then
            echo "::error::pin these actions by full commit sha (uses: owner/repo@<sha> # vX.Y.Z)"
            exit 1
          fi
      - name: nixfmt
        if: ${{ !cancelled() }}
        run: git ls-files -z '*.nix' | xargs -0 nix run nixpkgs#nixfmt -- --check
      - name: flake evaluation
        if: ${{ !cancelled() }}
        # every output on every system; the builds run in the check job
        run: nix flake check --no-build --all-systems
      - name: ruff check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff check --output-format github
      - name: ruff format
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff format --check
      - name: ty
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ty check --output-format github

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # enable_kvm (default true) makes /dev/kvm usable for the NixOS VM test
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - id: sync
        run: uv sync --locked
      - name: pytest
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest -v
      # The composite action on a real runner, against a closed port: python
      # setup and module loading must work, and the request must fail cleanly.
      - id: action
        name: composite action (expected to fail)
        if: ${{ !cancelled() }}
        uses: ./
        continue-on-error: true
        with:
          endpoint: http://127.0.0.1:9
          site: demo
          secret: dummy
          action: teardown
          deployments: "false"
      - name: composite action reported the failure
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          [[ $OUTCOME == failure ]]
          [[ $(command -v python3) != "$RUNNER_TOOL_CACHE"/* ]] # caller's PATH untouched
      # announce only warns: an unreachable host must not fail the build
      - name: composite action announce (expected to succeed)
        if: ${{ !cancelled() }}
        uses: ./
        with:
          endpoint: http://127.0.0.1:9
          site: demo
          secret: dummy
          action: announce
          environment: next
      - name: nix flake check
        if: ${{ !cancelled() }}
        # package (unit tests with nixpkgs' python) and the NixOS VM test
        run: nix flake check -L
