name: ci

on:
  push:
    branches: [main]
  pull_request:
  # flake-update.yml dispatches this: PRs opened with GITHUB_TOKEN trigger nothing else
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job is independent: they all run in parallel.
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix run nixpkgs#actionlint

  nixfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: git ls-files -z '*.nix' | xargs -0 nix run nixpkgs#nixfmt -- --check

  python:
    name: python (${{ matrix.check.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: ruff check, run: uv run ruff check --output-format github }
          - { name: ruff format, run: uv run ruff format --check }
          - { name: ty, run: uv run ty check --output-format github }
          - { name: pytest, run: uv run pytest -v }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: ${{ matrix.check.run }}

  # The composite action end to end on a runner, against a closed port:
  # python setup and module loading must work, and the request must fail cleanly.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: muelle
        uses: ./
        continue-on-error: true
        with:
          endpoint: http://127.0.0.1:9
          site: demo
          secret: dummy
          action: teardown
          deployments: "false"
      - name: The client ran and reported the failure
        env:
          OUTCOME: ${{ steps.muelle.outcome }}
        run: |
          [[ $OUTCOME == failure ]]
          [[ $(command -v python3) != "$RUNNER_TOOL_CACHE"/* ]] # caller's PATH untouched

  nix:
    name: nix (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package: build + pytest with nixpkgs' python; vm: NixOS integration test
        check: [package, vm]
    steps:
      - uses: actions/checkout@v7
      # enable_kvm (default true) makes /dev/kvm usable for the NixOS VM test
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L --no-link ".#checks.x86_64-linux.${{ matrix.check }}"

  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # evaluates every output on every system; the builds run in the nix job
      - run: nix flake check --no-build --all-systems
